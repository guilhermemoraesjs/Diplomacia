name: Testes
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  unitarios-e-versao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test            # unitários (Node puro) + consistência de versão / Service Worker / index.html
  e2e:
    runs-on: ubuntu-latest
    needs: unitarios-e-versao
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }   # exigido pelo Firestore Emulator
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e   # sobe Auth + Firestore Emulator e roda todas as suítes de navegador
